<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <div class="banner"></div>
    <div class="avatar">AK</div>
    <h2>Arjun Kumar</h2>
    <p class="role">Web Development</p>

    <ul class="skills">
      <li>HTML</li>
      <li>CSS</li>
      <li>Java script</li>
      <li>Git</li>
    </ul>

    <p class="followers"><span id="follower-count">120</span> Followers</p>
    <button id="follow-btn" class="follow-btn">Follow</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
